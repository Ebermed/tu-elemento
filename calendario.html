<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#FBF7F0">
<title>Calendario — Tu Elemento</title>
<style>
html,body{margin:0;min-height:100%;background:#FBF7F0;color:#2E2A26;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#arranque{min-height:100vh;display:grid;place-items:center;padding:28px;text-align:center}
#arranque span{font-family:Georgia,serif;font-style:italic;font-size:18px;opacity:.58}
</style>
</head>
<body>
<div id="arranque"><span>Preparando tu calendario…</span></div>
<script>
(function(){
  'use strict';
  var VERSION='10.2.0';
  var EXTRA='<style id="v102-cal">'+
    '.calPerfilBox{overflow:hidden!important;width:min(88%,360px)!important;margin:0 auto 16px!important;padding:9px 11px!important;border-radius:18px!important;box-shadow:0 8px 24px rgba(58,43,34,.045),inset 0 1px 0 rgba(255,255,255,.82)!important}'+
    '.calPerfilBox label{margin:0 0 4px!important;font-size:9px!important;letter-spacing:1.65px!important}'+
    '.calPerfilSelect select{appearance:none!important;-webkit-appearance:none!important;min-height:40px!important;padding:0 38px 0 12px!important;border-radius:14px!important;font-size:14px!important;font-weight:620!important;background:rgba(255,255,255,.70)!important;border:1px solid rgba(255,255,255,.86)!important;box-shadow:0 6px 20px rgba(58,43,34,.05),inset 0 1px 0 #fff!important}'+
    '.calPerfilSelect:after{content:"⌄";position:absolute;right:13px!important;top:50%;transform:translateY(-56%);font-size:17px!important;color:var(--tinta-suave);pointer-events:none}'+
    '.calPerfilBox .pista{margin:5px 2px 0!important;font-size:11px!important;line-height:1.35!important;opacity:.78}'+
    '.calSinPerfil{width:min(88%,360px)!important;margin:0 auto 16px!important;padding:9px 12px!important;border-radius:16px!important;font-size:12px!important;line-height:1.4!important;text-align:center!important}'+
    '</style>';

  fetch('calendario-source-v10.html?v='+VERSION,{cache:'no-store'})
    .then(function(r){if(!r.ok)throw new Error('source');return r.text();})
    .then(function(html){
      var intro='Cada fecha mezcla dos ritmos del calendario solar chino. Juntos ayudan a ver qué tipo de actividades fluyen mejor ese día y cuáles agradecen un poco más de margen. Con una carta guardada, la lectura también se cruza con su origen.';
      html=html.replace('<h1 style="font-size:clamp(25px,5vw,34px); margin-bottom:8px">¿Cómo viene el día?</h1>\n    <p class="bajada" style="margin-bottom:20px">'+intro+'</p>','<h1 style="font-size:clamp(25px,5vw,34px); margin-bottom:20px">¿Cómo viene el día?</h1>');
      html=html.replace('<summary>¿De dónde sale esta lectura?</summary>\n      <p>Usamos dos ciclos tradicionales del calendario chino.','<summary>¿De dónde sale esta lectura?</summary>\n      <p>'+intro+'</p>\n      <p>Usamos dos ciclos tradicionales del calendario chino.');
      html=html.replace(/href="estilo\.css(?:\?v=[^"]+)?"/g,'href="estilo.css?v='+VERSION+'"');
      html=html.replace(/src="([a-zA-Z0-9_-]+\.js)(?:\?v=[^"]+)?"/g,'src="$1?v='+VERSION+'"');
      html=html.replace('</head>',EXTRA+'</head>');
      document.open();
      document.write(html);
      document.close();
    })
    .catch(function(){
      document.getElementById('arranque').innerHTML='<div><p style="font-family:Georgia,serif;font-size:24px">Tu Elemento</p><button onclick="location.reload()" style="border:0;border-radius:999px;padding:14px 22px;background:#2E2A26;color:#fff;font:inherit">Volver a cargar</button></div>';
    });
})();
</script>
</body>
</html>
