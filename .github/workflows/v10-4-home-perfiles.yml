name: V10.4 saved-card home

on:
  push:
    branches: [main]
    paths:
      - '_v10_4_trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply V10.4 UX patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('base.js')
          s = p.read_text(encoding='utf-8')
          marker = '/* ═══ V10.4 · home para perfiles guardados ═══ */'
          if marker not in s:
              s += r'''

/* ═══ V10.4 · home para perfiles guardados ═══ */
(function (raiz) {
  'use strict';

  /* La lectura de vacíos se vuelve concreta combinando zona + elemento. */
  if (typeof raiz.lecturaCompleta === 'function' && !raiz.__teLecturaV104) {
    raiz.__teLecturaV104 = true;
    var lecturaAnterior = raiz.lecturaCompleta;
    var ZONA = {
      anio: {
        nombre:'Tu origen',
        cuerpo:'Este vacío aparece en Tu origen, la parte de tu carta relacionada con familia, pertenencia, amistades tempranas y el lugar que ocupas dentro de un grupo. Puede sentirse como tardar un poco más en descubrir qué costumbres, personas o ambientes realmente sientes tuyos.'
      },
      mes: {
        nombre:'Tu trayectoria',
        cuerpo:'Este vacío aparece en Tu trayectoria, la parte relacionada con estudios, trabajo, responsabilidades y logros. Puede sentirse como tener que construir tu propio criterio profesional a base de probar, ajustar y encontrar una manera de avanzar que sí te haga sentido.'
      },
      hora: {
        nombre:'Tu futuro',
        cuerpo:'Este vacío aparece en Tu futuro, la parte relacionada con proyectos, hijos, vida interior y lo que quieres dejar construido con el tiempo. Puede sentirse como ir definiendo esa zona más adelante, a medida que descubres qué proyectos merecen de verdad tu energía.'
      }
    };
    var ELEMENTO = {
      madera:{
        cuerpo:'Como aquí aparece Madera, el aprendizaje está en crecer con soporte propio: aprender, desarrollar recursos y tomar decisiones que también nazcan de ti.',
        accion:'Trabájalo así: elige una habilidad o proyecto cuyo siguiente paso dependa principalmente de ti.'
      },
      fuego:{
        cuerpo:'Como aquí aparece Fuego, el aprendizaje está en ganar claridad: reconocer qué quieres, hacerlo visible y confiar más en tu propia lectura de la situación.',
        accion:'Trabájalo así: ponle nombre a lo que quieres antes de buscar aprobación afuera.'
      },
      tierra:{
        cuerpo:'Como aquí aparece Tierra, el aprendizaje está en construir estabilidad y también en saber soltar. Tener raíces firmes pesa menos cuando distingues qué merece quedarse contigo y qué ya cumplió su etapa.',
        accion:'Trabájalo así: identifica una carga que ya puedes dejar y un punto de apoyo que sí quieres conservar.'
      },
      metal:{
        cuerpo:'Como aquí aparece Metal, el aprendizaje está en poner en palabras tu criterio: decir lo que piensas, marcar límites y convertir lo que sabes en una posición clara.',
        accion:'Trabájalo así: expresa una decisión importante de forma simple y concreta.'
      },
      agua:{
        cuerpo:'Como aquí aparece Agua, el aprendizaje está en ordenar ideas, decidir y llevar esa decisión a algo concreto. Pensar sirve más cuando termina encontrando un cauce.',
        accion:'Trabájalo así: convierte una decisión pendiente en un siguiente paso con fecha.'
      }
    };

    raiz.lecturaCompleta = function (carta, sinHora) {
      var lec = lecturaAnterior(carta, sinHora);
      if (!lec) return lec;

      (lec.pilares || []).forEach(function (p) {
        if (p.clave === 'dia') {
          p.titulo = 'Tu centro';
          p.etapa = 'tu centro y tus vínculos cercanos';
          p.intro = 'Tu centro reúne la parte más personal de la carta. Aquí aparece el tallo que define tu elemento base, junto con una capa ligada a pareja, intimidad y vida emocional.';
        }
      });

      (lec.tensiones || []).forEach(function (x) {
        if (!x.texto) return;
        x.texto = x.texto
          .replace(/Tu origen y tú/g, 'Tu origen y tu centro')
          .replace(/Tu trayectoria y tú/g, 'Tu trayectoria y tu centro')
          .replace(/Tú y tu futuro/g, 'Tu centro y tu futuro');
      });

      lec.vacios = (lec.vacios || []).map(function (v) {
        var zona = ZONA[v.pilar] || { nombre:v.titulo, cuerpo:v.texto };
        var pilar = carta && carta.pilares ? carta.pilares[v.pilar] : null;
        var elemento = pilar && pilar.tallo ? pilar.tallo.elemento : '';
        var matiz = ELEMENTO[elemento] || { cuerpo:'', accion:v.filo || '' };
        var etiqueta = elemento ? elemento.charAt(0).toUpperCase() + elemento.slice(1) : '';
        return {
          pilar:v.pilar,
          titulo:(etiqueta ? 'Vacío de ' + etiqueta + ' en ' : 'Vacío en ') + zona.nombre,
          texto:zona.cuerpo + (matiz.cuerpo ? ' ' + matiz.cuerpo : ''),
          filo:matiz.accion,
          rama:v.rama,
          elemento:elemento,
          elementoEtiqueta:etiqueta
        };
      });
      return lec;
    };
  }

  if (typeof document === 'undefined') return;

  function inyectarEstilos() {
    if (document.getElementById('te-v104-css')) return;
    var st = document.createElement('style');
    st.id = 'te-v104-css';
    st.textContent = '\
      #p-portada.portadaRegreso{padding-top:clamp(48px,10vh,86px)}\
      #p-portada.portadaRegreso>h1{margin:14px 0 8px;font-size:clamp(36px,8vw,54px)}\
      #p-portada.portadaRegreso .bibliotecaCartas{width:100%;max-width:680px;margin:22px auto 18px;padding:18px;border-radius:30px;background:linear-gradient(145deg,rgba(255,255,255,.58),rgba(255,255,255,.30));border:1px solid rgba(255,255,255,.80);box-shadow:0 18px 50px rgba(62,46,35,.075),inset 0 1px 0 rgba(255,255,255,.92);-webkit-backdrop-filter:blur(26px) saturate(155%);backdrop-filter:blur(26px) saturate(155%)}\
      #p-portada.portadaRegreso .bibliotecaCab{margin-bottom:16px}\
      #p-portada.portadaRegreso .bibliotecaCab h2{font-family:Georgia,serif;font-size:clamp(25px,5.5vw,34px);font-weight:500;margin:4px 0 5px}\
      #p-portada.portadaRegreso .listaPerfiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}\
      #p-portada.portadaRegreso .perfilCard{display:flex;flex-direction:column;align-items:flex-start;min-width:0;min-height:222px;padding:16px;border-radius:24px;background:rgba(255,255,255,.53);border:1px solid rgba(255,255,255,.78);box-shadow:inset 0 1px 0 rgba(255,255,255,.92),0 9px 28px rgba(55,42,34,.05)}\
      #p-portada.portadaRegreso .perfilIcono{width:54px;height:54px;margin-bottom:12px;border-radius:19px;background:rgba(255,255,255,.72)}\
      #p-portada.portadaRegreso .perfilInfo{width:100%}\
      #p-portada.portadaRegreso .perfilInfo strong{font-size:27px}\
      #p-portada.portadaRegreso .perfilInfo small{white-space:normal;line-height:1.35;margin-top:3px}\
      #p-portada.portadaRegreso .perfilAcciones{display:grid;grid-template-columns:1fr;gap:6px;width:100%;margin-top:auto;padding-top:14px}\
      #p-portada.portadaRegreso .perfilAccion{display:block;text-align:center;padding:9px 10px}\
      #p-portada.portadaRegreso .perfilOlvidar{width:100%;margin:2px 0 0;text-align:center;font-size:11px;opacity:.70}\
      .cartaVolver{position:absolute;z-index:8;left:max(18px,calc((100% - 680px)/2));top:22px;width:46px;height:46px;border-radius:999px;border:1px solid rgba(255,255,255,.82);background:rgba(255,255,255,.48);color:var(--tinta);font-family:Georgia,serif;font-size:34px;line-height:1;display:grid;place-items:center;box-shadow:0 10px 30px rgba(55,42,34,.07),inset 0 1px 0 rgba(255,255,255,.96);-webkit-backdrop-filter:blur(20px) saturate(150%);backdrop-filter:blur(20px) saturate(150%);cursor:pointer}\
      #p-resultado{position:relative}\
      .calPerfilBox.teCompacto{width:min(82%,330px)!important;margin:0 auto 12px!important;padding:7px 9px!important;border-radius:16px!important}\
      .calPerfilBox.teCompacto label{font-size:8px!important;margin-bottom:3px!important}\
      .calPerfilBox.teCompacto select{min-height:38px!important;font-size:13px!important}\
      .calPerfilBox.teCompacto .pista{font-size:10px!important;margin-top:4px!important}\
      @media(max-width:420px){#p-portada.portadaRegreso .listaPerfiles{grid-template-columns:repeat(2,minmax(0,1fr))}#p-portada.portadaRegreso .perfilCard{min-height:210px;padding:13px}.cartaVolver{left:16px;top:18px;width:42px;height:42px;font-size:31px}}\
    ';
    document.head.appendChild(st);
  }

  function prepararPortadaRecurrente() {
    if (typeof listarPerfiles !== 'function') return;
    var perfiles = listarPerfiles();
    var portada = document.getElementById('p-portada');
    if (!portada || !perfiles.length) return;

    portada.classList.add('portadaRegreso');
    var h1 = portada.querySelector('h1');
    if (h1) h1.textContent = 'Bienvenido de nuevo';

    var hijos = portada.children;
    for (var i=0;i<hijos.length;i++) {
      if (hijos[i].classList && hijos[i].classList.contains('bajada')) hijos[i].hidden = true;
    }
    var descubrir = document.getElementById('irForm');
    if (descubrir) descubrir.hidden = true;
    var diez = portada.querySelector('.diez');
    if (diez) diez.hidden = true;
    var detalle = portada.querySelector('details');
    if (detalle) detalle.hidden = true;

    var biblioteca = document.getElementById('bibliotecaCartas');
    if (biblioteca) {
      biblioteca.hidden = false;
      if (h1 && h1.nextSibling !== biblioteca) h1.parentNode.insertBefore(biblioteca, h1.nextSibling);
      var kicker = biblioteca.querySelector('.miniKicker');
      if (kicker) kicker.textContent = 'Tus cartas';
      var titulo = biblioteca.querySelector('h2');
      if (titulo) titulo.textContent = 'Aquí están tus cartas';
      var sub = biblioteca.querySelector('.sub');
      if (sub) sub.textContent = 'Elige una para abrir su lectura o cambia al calendario de esa persona.';
    }
  }

  function prepararCalendario() {
    var titulo = document.querySelector('#p-dias h1');
    if (!titulo || titulo.textContent.indexOf('¿Cómo viene el día?') === -1) return;
    var sig = titulo.nextElementSibling;
    var intro = 'Cada fecha mezcla dos ritmos del calendario solar chino. Juntos ayudan a ver qué tipo de actividades fluyen mejor ese día y cuáles agradecen un poco más de margen. Con una carta guardada, la lectura también se cruza con su origen.';
    if (sig && sig.classList && sig.classList.contains('bajada')) sig.remove();
    var details = document.querySelector('#p-dias details');
    if (details && !details.querySelector('.teIntroCalendario')) {
      var p = document.createElement('p');
      p.className = 'teIntroCalendario';
      p.textContent = intro;
      var summary = details.querySelector('summary');
      if (summary) summary.insertAdjacentElement('afterend', p);
    }
    var selector = document.getElementById('calPerfilBox');
    if (selector) selector.classList.add('teCompacto');
  }

  function ponerFlechaCarta() {
    var pantalla = document.getElementById('p-resultado');
    if (!pantalla || pantalla.querySelector('.cartaVolver')) return;
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'cartaVolver';
    b.setAttribute('aria-label','Volver a tus cartas');
    b.textContent = '‹';
    b.addEventListener('click', function () {
      prepararPortadaRecurrente();
      if (typeof PALETA_NEUTRA !== 'undefined' && typeof pintarFondo === 'function') pintarFondo(PALETA_NEUTRA, 88);
      if (typeof ir === 'function') ir('p-portada');
    });
    pantalla.appendChild(b);
  }

  /* Abrir un mosaico recarga con el id explícito: camino único y estable. */
  document.addEventListener('click', function (e) {
    var t = e.target && e.target.closest ? e.target.closest('[data-perfil-ver]') : null;
    if (!t) return;
    var id = t.getAttribute('data-perfil-ver');
    if (!id) return;
    e.preventDefault();
    e.stopImmediatePropagation();
    globalThis.location.href = 'index.html?perfil=' + encodeURIComponent(id);
  }, true);

  function listo() {
    inyectarEstilos();
    prepararPortadaRecurrente();
    prepararCalendario();
    ponerFlechaCarta();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', listo);
  else setTimeout(listo, 0);

})(typeof globalThis !== 'undefined' ? globalThis : this);
'''
          p.write_text(s, encoding='utf-8')

          # Forzar la revisión nueva del módulo compartido en ambas fuentes.
          for nombre in ('app-source-v10.html','calendario-source-v10.html'):
              p = Path(nombre)
              s = p.read_text(encoding='utf-8')
              s = s.replace('<script src="base.js"></script>', '<script src="base.js?v=10.4.0"></script>')
              p.write_text(s, encoding='utf-8')

          # Corregir la descripción de los cuatro pilares en la primera visita.
          p = Path('app-source-v10.html')
          s = p.read_text(encoding='utf-8').replace('tu origen, tu trayectoria, tú y lo que vas construyendo hacia el futuro.', 'tu origen, tu trayectoria, tu centro y lo que vas construyendo hacia el futuro.')
          p.write_text(s, encoding='utf-8')

          # El redirect conserva perfil=id y fuerza una versión nueva de la fuente.
          for nombre, fuente in (('index.html','app-source-v10.html'),('calendario.html','calendario-source-v10.html')):
              p = Path(nombre)
              s = p.read_text(encoding='utf-8')
              viejo = "var destino='" + fuente
              pos = s.find(viejo)
              if pos >= 0:
                  ini = pos
                  fin = s.find(';', ini)
                  s = s[:ini] + "var destino='" + fuente + "?v=10.4.0' + (location.search ? '&' + location.search.slice(1) : '')" + s[fin:]
              p.write_text(s, encoding='utf-8')
          PY

      - name: Regression
        run: |
          node --check base.js
          node test.js
          node test-decadas.js

      - name: Commit V10.4
        shell: bash
        run: |
          git config user.name "Tu Elemento Bot"
          git config user.email "actions@users.noreply.github.com"
          git add base.js app-source-v10.html calendario-source-v10.html index.html calendario.html
          git diff --cached --quiet && exit 0
          git commit -m "Add returning-user card home and direct profile navigation"
          git push
