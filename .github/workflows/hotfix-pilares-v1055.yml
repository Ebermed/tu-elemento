name: V10.5.5 pillar rendering hotfix

on:
  push:
    branches: [main]
    paths:
      - '_trigger_v1055.txt'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Patch only rendering around the carta
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 1) La lectura completa deja de entrar al sistema global de blur/reveal.
          p=Path('base.js')
          s=p.read_text(encoding='utf-8')
          old="""function activarApariciones(scope) {
  var raiz = scope && scope.querySelectorAll ? scope : document;
  var nodos = raiz.querySelectorAll('.hoja, .inter, .vidrio, .col, .revela');"""
          new="""function activarApariciones(scope) {
  var raiz = scope && scope.querySelectorAll ? scope : document;
  if (scope && scope.id === 'lectura') {
    var fijos = scope.querySelectorAll('.hoja, .inter, .col, .panel, .revela');
    for (var q = 0; q < fijos.length; q++) {
      fijos[q].classList.remove('revela-prep', 'revela-viva');
      if (fijos[q].style) {
        fijos[q].style.filter = 'none';
        fijos[q].style.transform = 'none';
        fijos[q].style.opacity = '1';
        fijos[q].style.transition = 'none';
      }
    }
    return;
  }
  var nodos = raiz.querySelectorAll('.hoja, .inter, .vidrio, .col, .revela');"""
          if old not in s: raise SystemExit('No encontré activarApariciones esperado')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          # 2) En la lectura, glass visual mediante fondos/bordes; sin filtros del compositor.
          p=Path('estilo.css')
          s=p.read_text(encoding='utf-8')
          marker='/* V10.5.5 · CARTA SIN FILTROS ANIDADOS */'
          if marker not in s:
            s += r'''

/* V10.5.5 · CARTA SIN FILTROS ANIDADOS
   El acordeón conserva su diseño y contenido. Esta zona evita backdrop-filter
   y filter porque el cambio de altura obligaba a recomponer muchas capas. */
#lectura .hoja,
#lectura .inter,
#lectura .col,
#lectura .panel {
  -webkit-backdrop-filter:none!important;
  backdrop-filter:none!important;
  filter:none!important;
  will-change:auto!important;
}
#lectura .revela-prep,
#lectura .revela-prep.revela-viva {
  opacity:1!important;
  transform:none!important;
  filter:none!important;
  transition:none!important;
}
#lectura .hoja {
  background:rgba(255,253,249,.90)!important;
}
#lectura .inter {
  background:rgba(255,255,255,.62)!important;
}
#lectura .col {
  background:rgba(255,255,255,.66)!important;
  transition:background .12s ease,border-color .12s ease!important;
}
#lectura .col[aria-expanded="true"] {
  background:rgba(255,255,255,.96)!important;
}
#lectura .panel.abierto {
  animation:none!important;
}
'''
          p.write_text(s,encoding='utf-8')

          # 3) Cache bust únicamente. La estructura HTML permanece idéntica.
          p=Path('app-v105.html')
          s=p.read_text(encoding='utf-8').replace('?v=10.5.2','?v=10.5.5')
          p.write_text(s,encoding='utf-8')
          p=Path('index.html')
          s=p.read_text(encoding='utf-8').replace('app-v105.html?v=10.5.4','app-v105.html?v=10.5.5')
          p.write_text(s,encoding='utf-8')

          # Ajusta el contrato UI a la versión publicada.
          p=Path('test-ui-v105.js')
          if p.exists():
            s=p.read_text(encoding='utf-8').replace('app-v105.html?v=10.5.4','app-v105.html?v=10.5.5').replace('V10.5.4 UI','V10.5.5 UI')
            p.write_text(s,encoding='utf-8')
          PY

      - name: Syntax and regression checks
        shell: bash
        run: |
          node --check base.js
          node --check app-v105.js
          node --check app-v105-submit-fix.js
          node test.js
          node test-decadas.js
          if [ -f test-runtime-v105.js ]; then node test-runtime-v105.js; fi
          if [ -f test-ui-v105.js ]; then node test-ui-v105.js; fi
          grep -q 'CARTA SIN FILTROS ANIDADOS' estilo.css
          grep -q "scope.id === 'lectura'" base.js
          grep -q 'app-v105.html?v=10.5.5' index.html

      - name: Commit tested hotfix
        shell: bash
        run: |
          git config user.name 'Tu Elemento Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add base.js estilo.css app-v105.html index.html test-ui-v105.js
          git diff --cached --quiet && exit 0
          git commit -m 'Fix pillar freeze by removing nested carta filters'
          git push
