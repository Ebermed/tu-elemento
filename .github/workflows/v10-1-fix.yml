name: V10.1 one-shot fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v10-1-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply V10.1 patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          VERSION = '10.1.0'

          for name in ('index.html', 'calendario.html'):
              p = Path(name)
              text = p.read_text(encoding='utf-8')

              # Fuerza una URL nueva por release para evitar que iOS/Brave mezcle
              # HTML nuevo con JS/CSS de una versión anterior.
              text = re.sub(r'href="estilo\.css(?:\?v=[^"]+)?"',
                            f'href="estilo.css?v={VERSION}"', text)
              text = re.sub(r'src="([a-zA-Z0-9_-]+\.js)(?:\?v=[^"]+)?"',
                            lambda m: f'src="{m.group(1)}?v={VERSION}"', text)
              p.write_text(text, encoding='utf-8')

          css = Path('estilo.css')
          text = css.read_text(encoding='utf-8')
          marker = '/* ═══ V10.1 · segmented control + cache-safe release ═══ */'
          if marker not in text:
              text += r'''

/* ═══ V10.1 · segmented control + cache-safe release ═══ */
.paraQuien {
  width:100%;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:4px;
  padding:4px;
  border-radius:22px;
  background:rgba(255,255,255,.34);
  border:1px solid rgba(255,255,255,.78);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.84),0 12px 32px rgba(62,46,35,.05);
  -webkit-backdrop-filter:blur(20px) saturate(150%);
  backdrop-filter:blur(20px) saturate(150%);
}
.paraQuienBtn {
  position:relative;
  appearance:none;
  -webkit-appearance:none;
  width:100%;
  min-height:52px;
  padding:0 16px;
  border:0!important;
  border-radius:18px!important;
  background:transparent!important;
  color:var(--tinta-suave)!important;
  font:inherit;
  font-size:15px;
  font-weight:600;
  letter-spacing:-.1px;
  box-shadow:none!important;
  cursor:pointer;
  transition:transform .20s var(--curva),background .24s var(--curva),box-shadow .24s var(--curva),color .24s var(--curva);
}
.paraQuienBtn.activo {
  color:var(--tinta)!important;
  font-weight:720;
  background:rgba(255,255,255,.88)!important;
  box-shadow:0 8px 24px rgba(58,43,34,.10),inset 0 1px 0 rgba(255,255,255,1)!important;
}
.paraQuienBtn.activo::after {
  content:'';
  position:absolute;
  left:50%;
  bottom:7px;
  width:18px;
  height:2px;
  border-radius:99px;
  background:var(--acento);
  transform:translateX(-50%);
  opacity:.78;
}
.paraQuienBtn:active { transform:scale(.975); }
.paraQuienBtn:focus-visible { outline:2px solid var(--acento); outline-offset:2px; }

@media (max-width:430px) {
  .paraQuien { border-radius:20px; }
  .paraQuienBtn { min-height:50px; border-radius:16px!important; font-size:14.5px; }
}
'''
          css.write_text(text, encoding='utf-8')
          PY

      - name: Run regression tests
        run: |
          node test.js
          node test-decadas.js
          node test-paginas.js

      - name: Commit V10.1
        shell: bash
        run: |
          git config user.name "Tu Elemento Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html calendario.html estilo.css
          git diff --cached --quiet && exit 0
          git commit -m "Fix V10.1 cache and profile controls"
          git push
