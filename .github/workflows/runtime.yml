name: Tu Elemento V11 runtime

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax
        run: |
          for f in v11/*.js; do node --check "$f"; done
      - name: Core calculations
        run: |
          cd v11
          node test.js
          node test-decadas.js
          node test-mensual.js
          node test-mes-solar.js
          node test-calendario-solar.js
      - name: Monthly vocabulary guard
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const files=['v11/lectura-mensual.js','v11/mes.js','v11/test-mensual.js'];
          const text=files.map(f=>fs.readFileSync(f,'utf8')).join('\n');
          const forbidden=[
            /\bRD\b/,/\bRI\b/,/\bCD\b/,/\bCI\b/,/\bPD\b/,/\bPI\b/,/\bED\b/,/\bEI\b/,/\bID\b/,/\bII\b/,
            /Relación Directa/i,/Relación Indirecta/i,/Creatividad Directa/i,/Creatividad Indirecta/i,
            /Prosperidad Directa/i,/Prosperidad Indirecta/i,/Emoción Directa/i,/Emoción Indirecta/i,
            /Intelecto Directo/i,/Intelecto Indirecto/i,
            /\bFlorecer\b/i,/\bProsperar\b/i,/\bCoronar\b/i,/\bRenovar\b/i,/\bExtinguir\b/i,/\bConcebir\b/i,/\bNutrir\b/i
          ];
          const hits=forbidden.filter(r=>r.test(text)).map(String);
          if(hits.length) throw new Error('Vocabulario mensual reservado detectado: '+hits.join(', '));
          console.log('Monthly vocabulary guard: OK');
          NODE
      - name: V11 architecture contract
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const index=fs.readFileSync('v11/index.html','utf8');
          const base=fs.readFileSync('v11/base.js','utf8');
          const pillars=fs.readFileSync('v11/pilares.js','utf8');
          const calendar=fs.readFileSync('v11/calendario.html','utf8');
          const month=fs.readFileSync('v11/mes.html','utf8');
          function ok(v,msg){if(!v)throw new Error(msg)}
          ok(index.includes('app.css')&&index.includes('app.js')&&index.includes('pilares.js'),'V11 index asset graph');
          ok(index.includes('calendario-solar.js')&&index.includes('solar-presentacion.js'),'chart solar context graph');
          ok(index.includes('id="calcular"')&&index.includes('type="button"'),'single-click form route');
          ok(!index.includes('?v=')&&!index.includes('v105')&&!index.includes('v10'),'legacy entry reference');
          ok(base.includes("tuelemento.v11.perfiles"),'V11 storage key');
          ok(base.includes("11-clean-20260821"),'V11 reset epoch');
          ok(!base.includes('LLAVE_ANTERIOR')&&!base.includes('_migrarNacimientoAnterior')&&!base.includes('guardarNacimiento'),'legacy storage API');
          ok(!pillars.includes('requestAnimationFrame')&&!pillars.includes('cloneNode')&&!pillars.includes('scrollHeight'),'pillar layout work');
          ok(calendar.includes('calendario.js')&&calendar.includes('calendario-presentacion.js'),'calendar graph');
          ok(calendar.includes('calendario-solar.js')&&calendar.includes('solar-presentacion.js'),'calendar solar context graph');
          ok(month.includes('mes-solar.js')&&month.includes('mes.js'),'monthly solar graph');
          console.log('V11 architecture contract: OK');
          NODE
