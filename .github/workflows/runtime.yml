name: Tu Elemento runtime

on:
  push:
    branches: [ main, v2-broadway ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax
        run: |
          for f in v11/*.js; do node --check "$f"; done
      - name: Core calculations
        run: |
          cd v11
          node test.js
          node test-decadas.js
          node test-mensual.js
          node test-mes-solar.js
          node test-calendario-solar.js
      - name: Monthly vocabulary guard
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const files=['v11/lectura-mensual.js','v11/mes.js','v11/test-mensual.js'];
          const text=files.map(f=>fs.readFileSync(f,'utf8')).join('\n');
          const forbidden=[
            /\bRD\b/,/\bRI\b/,/\bCD\b/,/\bCI\b/,/\bPD\b/,/\bPI\b/,/\bED\b/,/\bEI\b/,/\bID\b/,/\bII\b/,
            /Relación Directa/i,/Relación Indirecta/i,/Creatividad Directa/i,/Creatividad Indirecta/i,
            /Prosperidad Directa/i,/Prosperidad Indirecta/i,/Emoción Directa/i,/Emoción Indirecta/i,
            /Intelecto Directo/i,/Intelecto Indirecto/i,
            /\bFlorecer\b/i,/\bProsperar\b/i,/\bCoronar\b/i,/\bRenovar\b/i,/\bExtinguir\b/i,/\bConcebir\b/i,/\bNutrir\b/i
          ];
          const hits=forbidden.filter(r=>r.test(text)).map(String);
          if(hits.length) throw new Error('Vocabulario mensual reservado detectado: '+hits.join(', '));
          console.log('Monthly vocabulary guard: OK');
          NODE
      - name: Runtime architecture contract
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const index=fs.readFileSync('v11/index.html','utf8');
          const base=fs.readFileSync('v11/base.js','utf8');
          const pillars=fs.readFileSync('v11/pilares.js','utf8');
          const calendar=fs.readFileSync('v11/calendario.html','utf8');
          const month=fs.readFileSync('v11/mes.html','utf8');
          function ok(v,msg){if(!v)throw new Error(msg)}
          ok(index.includes('app.css')&&index.includes('app.js')&&index.includes('pilares.js'),'chart asset graph');
          ok(index.includes('calendario-solar.js')&&index.includes('solar-presentacion.js'),'chart solar context graph');
          ok(base.includes("tuelemento.v11.perfiles"),'storage key');
          ok(base.includes("11-clean-20260821"),'storage epoch');
          ok(pillars.includes('pilaresEstaticosV112')&&pillars.includes('transformarPilares'),'static pillar renderer');
          ok(!pillars.includes('cloneNode')&&!pillars.includes('scrollHeight'),'pillar renderer avoids clone/height measurement');
          ok(calendar.includes('calendario.js')&&calendar.includes('calendario-presentacion.js'),'calendar graph');
          ok(calendar.includes('calendario-solar.js')&&calendar.includes('solar-presentacion.js'),'calendar solar context graph');
          ok(month.includes('mes-solar.js')&&month.includes('mes.js'),'monthly solar graph');
          console.log('Runtime architecture contract: OK');
          NODE
      - name: Broadway ecosystem contract
        if: github.ref == 'refs/heads/v2-broadway' || github.head_ref == 'v2-broadway'
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const home=fs.readFileSync('index.html','utf8');
          const release=fs.readFileSync('v11/release.js','utf8');
          const eco=fs.readFileSync('v11/ecosistema.js','utf8');
          const cycles=fs.readFileSync('v11/ciclos.html','utf8');
          function ok(v,msg){if(!v)throw new Error(msg)}
          ['carta.html','nueva.html','calendario.html','mes.html','ciclos.html','v11/ciclos.html','v11/ecosistema.css','v11/ecosistema.js','v11/broadway-home.js'].forEach(f=>ok(fs.existsSync(f),'missing '+f));
          ok(home.includes('broadwayHome')&&home.includes('data-tool="carta"')&&home.includes('data-tool="buscar"'),'Broadway home graph');
          ok(!home.includes('location.replace'),'home must be a real hub');
          ok(release.includes("label: 'V2 Broadway'")&&release.includes("build: '2.0.0-broadway'"),'Broadway release metadata');
          ok(eco.includes("['carta','Carta'")&&eco.includes("['ciclos','Ciclos'"),'shared navigation items');
          ok(!eco.includes('MutationObserver')&&!eco.includes('requestAnimationFrame'),'navigation stays lightweight');
          ok(cycles.includes('ciclos-page.js')&&cycles.includes('perfilCiclos'),'cycles standalone graph');
          console.log('Broadway ecosystem contract: OK');
          NODE
